global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'gold-bot'
    environment: 'production'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'gold-bot'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'gold-bot-server'
    metrics_path: '/metrics'
    scrape_interval: 15s
