# 默认拉取 GHCR 发布镜像。本地构建使用：
# docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# 日常更新只拉取自家镜像（backend/frontend/pi-runtime 常变，infra 镜像固定版本）：
#   docker compose pull backend frontend pi-runtime && docker compose up -d
# 不要用裸 `docker compose pull`，它会把 redis/prometheus/grafana 也全拉一遍。
services:
  pi-runtime:
    image: ${GOLDBOT_PI_RUNTIME_IMAGE:-ghcr.io/sunnchao/gold-bot-py-pi-runtime:latest}
    pull_policy: always
    container_name: gold-bot-pi-runtime
    environment:
      TZ: Asia/Shanghai
      PI_RUNTIME_HOST: 0.0.0.0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-kimi-k3.1-pro}
      LLM_TRADE_MODEL: ${LLM_TRADE_MODEL:-deepseek-v4-flash-0731}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - pi-runtime-net

  backend:
    image: ${GOLDBOT_BACKEND_IMAGE:-ghcr.io/sunnchao/gold-bot-py-backend:latest}
    pull_policy: always
    container_name: gold-bot-backend
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      GB_APP_ENV: production
      GB_APP_SERVER_HOST: 0.0.0.0
      GB_APP_SERVER_PORT: 8000
      GB_EA_STORE_POSTGRES_DSN: ${GB_EA_STORE_POSTGRES_DSN:-${DSN:-}}
      GB_EA_STORE_SQLITE_PATH: ${GB_EA_STORE_SQLITE_PATH:-/code/data/gold_bolt.sqlite}
      GB_ADMIN_TOKEN: ${GB_ADMIN_TOKEN:-${ADMIN_TOKEN:-}}
      GB_NODE_SHADOW_MODE: "false"
      GB_REDIS_URL: redis://gold-bot-redis:6379
      REDIS_URL: redis://gold-bot-redis:6379
      GOLDBOT_API_URL: http://gold-bot-backend:8000
      PI_RUNTIME_URL: http://pi-runtime:3000
      LLM_MODEL: ${LLM_MODEL:-kimi-k3.1-pro}
      LLM_TRADE_TIMEOUT: ${LLM_TRADE_TIMEOUT:-35000}
    ports:
      - "127.0.0.1:8881:8000"
    volumes:
      - ./data:/code/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - 1panel-network
      - pi-runtime-net

  frontend:
    image: ${GOLDBOT_FRONTEND_IMAGE:-ghcr.io/sunnchao/gold-bot-py-frontend:latest}
    pull_policy: always
    container_name: gold-bot-frontend
    ports:
      - "127.0.0.1:8880:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - 1panel-network

  redis:
    image: redis:7-alpine
    # infra 镜像版本固定：本地缺失时才拉，up/更新时不重复拉取
    pull_policy: missing
    container_name: gold-bot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - 1panel-network

  prometheus:
    image: prom/prometheus:latest
    # 同上：只在缺失时拉取
    pull_policy: missing
    container_name: gold-bot-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - 1panel-network

  grafana:
    image: grafana/grafana:latest
    # 同上：只在缺失时拉取
    pull_policy: missing
    container_name: gold-bot-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:9092
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:9092:3000"
    restart: unless-stopped
    networks:
      - 1panel-network

volumes:
  prometheus_data:
  grafana_data:
  redis-data:

networks:
  1panel-network:
    external: true
  pi-runtime-net:
    driver: bridge
