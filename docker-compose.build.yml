# 两个镜像都消费 frontend/dist，构建前先产出静态资源：
#   (cd frontend && npm ci && npm run build)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: gold-bot-backend:local
    pull_policy: build

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gold-bot-frontend:local
    pull_policy: build
