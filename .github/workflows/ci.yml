name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".workbuddy/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          version: "latest"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests ../scripts
      - name: Type check
        run: uv run mypy src
      - name: Tests (L1-L4, skip slow)
        run: uv run pytest
      - name: Contract tests (L2)
        run: uv run pytest -m contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (L6)
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload static assets
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
             startsWith(github.ref, 'refs/tags/v')))
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  docker:
    name: Docker (${{ matrix.image }}/${{ matrix.arch }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         startsWith(github.ref, 'refs/tags/v')))
    needs:
      - backend
      - frontend
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: frontend/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # 每个架构在原生 runner 上单独推 digest。合并 job 再打上 latest / sha / tag。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/${{ matrix.image }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${{ matrix.image }}/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}
          retention-days: 1
          if-no-files-found: error

  docker-manifest:
    name: Docker manifest (${{ matrix.image }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         startsWith(github.ref, 'refs/tags/v')))
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected amd64 and arm64 digests, found ${#digests[@]}"
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in "${digests[@]}"; do
            args+=("ghcr.io/${{ github.repository }}-${{ matrix.image }}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"
